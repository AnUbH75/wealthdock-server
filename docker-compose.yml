# Local development only. Brings up Postgres for wealthdock-server.
# Run: docker compose up -d

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealthdock
      POSTGRES_PASSWORD: wealthdock
      POSTGRES_DB: wealthdock
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthdock -d wealthdock"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
